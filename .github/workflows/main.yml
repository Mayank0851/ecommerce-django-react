name: CI/CD Pipeline for Localhost

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest
                 
    steps:
    
    - name: Check out code
      uses: actions/checkout@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t mayankvishwakarma08/ecommerce-app:latest .

    - name: Push Docker image
      run: |
        docker push mayankvishwakarma08/ecommerce-app:latest

